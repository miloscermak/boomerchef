<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Recept pro tisk - BoomerChef</title>
    <style>
        /* Print-friendly CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.4;
            color: #000;
            background: white;
            padding: 20pt;
            max-width: 210mm;
            margin: 0 auto;
        }

        .print-header {
            text-align: center;
            margin-bottom: 30pt;
            border-bottom: 2pt solid #000;
            padding-bottom: 15pt;
        }

        .recipe-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 10pt;
        }

        .recipe-meta {
            font-size: 10pt;
            color: #666;
            margin-bottom: 5pt;
        }

        .recipe-meta span {
            margin-right: 15pt;
        }

        .recipe-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30pt;
            margin-top: 20pt;
        }

        .ingredients-section, .instructions-section {
            break-inside: avoid;
        }

        .section-title {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 15pt;
            text-transform: uppercase;
            border-bottom: 1pt solid #000;
            padding-bottom: 5pt;
        }

        .ingredients-list {
            list-style: none;
            margin-bottom: 20pt;
        }

        .ingredients-list li {
            margin-bottom: 8pt;
            padding-left: 15pt;
            position: relative;
        }

        .ingredients-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .instructions-list {
            list-style: none;
            counter-reset: step-counter;
        }

        .instructions-list li {
            counter-increment: step-counter;
            margin-bottom: 12pt;
            padding-left: 20pt;
            position: relative;
        }

        .instructions-list li::before {
            content: counter(step-counter) ".";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .print-footer {
            margin-top: 30pt;
            padding-top: 15pt;
            border-top: 1pt solid #000;
            text-align: center;
            font-size: 10pt;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50pt;
            font-size: 14pt;
        }

        .error {
            text-align: center;
            padding: 50pt;
        }

        .error h2 {
            font-size: 18pt;
            margin-bottom: 15pt;
        }

        /* Print-specific styles */
        @media print {
            body {
                padding: 0;
                margin: 0;
            }
            
            .print-header {
                margin-bottom: 20pt;
            }
            
            .recipe-content {
                margin-top: 15pt;
            }
            
            @page {
                margin: 15mm;
                size: A4;
            }
        }

        /* Single column layout for narrow screens or when needed */
        @media (max-width: 600px) {
            .recipe-content {
                grid-template-columns: 1fr;
                gap: 20pt;
            }
        }
    </style>
</head>
<body>
    <div id="print-content">
        <div class="loading">
            <p>Načítám recept pro tisk...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // Získání slug z URL parametrů
        function getSlugFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('slug');
        }

        // Načtení a zobrazení receptu pro tisk
        async function loadRecipeForPrint() {
            const slug = getSlugFromURL();
            
            if (!slug) {
                document.getElementById('print-content').innerHTML = `
                    <div class="error">
                        <h2>Recept nenalezen</h2>
                        <p>Recept nebyl nalezen nebo URL není správná.</p>
                    </div>
                `;
                return;
            }

            try {
                const recipe = await RecipeService.getRecipeBySlug(slug);

                if (!recipe) {
                    document.getElementById('print-content').innerHTML = `
                        <div class="error">
                            <h2>Recept nenalezen</h2>
                            <p>Recept s tímto názvem neexistuje nebo nebyl publikován.</p>
                        </div>
                    `;
                    return;
                }

                // Nastavení title stránky
                document.title = `${recipe.title} - BoomerChef (verze pro tisk)`;

                const printHTML = `
                    <div class="print-header">
                        <h1 class="recipe-title">${Utils.escapeHtml(recipe.title)}</h1>
                        <div class="recipe-meta">
                            <span>Publikováno: ${Utils.formatDate(recipe.created_at)}</span>
                            ${recipe.cooking_time ? `<span>Příprava: ${recipe.cooking_time} min</span>` : ''}
                            ${recipe.servings ? `<span>Porce: ${recipe.servings}</span>` : ''}
                        </div>
                    </div>

                    <div class="recipe-content">
                        <div class="ingredients-section">
                            <h2 class="section-title">Ingredience</h2>
                            <ul class="ingredients-list">
                                ${Utils.toListItems(recipe.ingredients)}
                            </ul>
                        </div>

                        <div class="instructions-section">
                            <h2 class="section-title">Postup přípravy</h2>
                            <ol class="instructions-list">
                                ${Utils.toListItems(recipe.instructions)}
                            </ol>
                        </div>
                    </div>

                    <div class="print-footer">
                        <p>Recept z BoomerChef.cz | Vytištěno: ${new Date().toLocaleDateString('cs-CZ')}</p>
                    </div>
                `;

                document.getElementById('print-content').innerHTML = printHTML;

            } catch (error) {
                console.error('Chyba při načítání receptu:', error);
                document.getElementById('print-content').innerHTML = `
                    <div class="error">
                        <h2>Chyba při načítání</h2>
                        <p>Nastala chyba při načítání receptu. Zkuste to prosím znovu.</p>
                    </div>
                `;
            }
        }

        // Spustit při načtení stránky
        document.addEventListener('DOMContentLoaded', loadRecipeForPrint);
    </script>
</body>
</html>
