<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoomerChef - Recepty s příběhem</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZT7YEQJE43"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZT7YEQJE43');
    </script>
</head>
<body>
    <header>
        <nav class="nav-container">
            <div class="logo">
                <h1><a href="index.html">BoomerChef</a></h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">Domů</a></li>
                <li><a href="recepty.html" class="nav-link">Recepty</a></li>
                <li><a href="o-projektu.html" class="nav-link">O projektu</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="latest-recipe">
            <div class="container">
                <div id="latest-recipe-content">
                    <div class="loading">Načítám nejnovější recept...</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 - 2026 BoomerChef - Recepty s příběhem</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // Načtení nejnovějšího receptu
        async function loadLatestRecipe() {
            const container = document.getElementById('latest-recipe-content');
            try {
                const recipe = await RecipeService.getLatestRecipe();

                if (!recipe) {
                    container.innerHTML = `
                        <div class="no-recipes">
                            <p>Zatím zde nejsou žádné recepty.</p>
                        </div>
                    `;
                    return;
                }

                const imageUrl = recipe.image_url ? ImageService.getImageUrl(recipe.image_url) : 'images/placeholder.svg';

                container.innerHTML = `
                    <article class="recipe-preview">
                        <div class="recipe-preview-image">
                            <img src="${imageUrl}" alt="${Utils.escapeHtml(recipe.image_alt || recipe.title)}">
                        </div>
                        <div class="recipe-preview-content">
                            <h3>${Utils.escapeHtml(recipe.title)}</h3>
                            <div class="recipe-story-preview">
                                ${Utils.formatStoryText(recipe.story, 300)}
                            </div>
                            <div class="recipe-actions">
                                <a href="recept.html?slug=${encodeURIComponent(recipe.slug)}" class="btn-primary">Zobrazit recept</a>
                                <a href="recepty.html" class="btn-secondary">Všechny recepty</a>
                            </div>
                        </div>
                    </article>
                `;
            } catch (error) {
                console.error('Chyba při načítání receptu:', error);
                container.innerHTML = `
                    <div class="error">
                        <p>Recept se nepodařilo načíst. Zkuste to prosím znovu.</p>
                        <a href="recepty.html" class="btn-primary">Všechny recepty</a>
                    </div>
                `;
            }
        }

        // Spustit při načtení
        document.addEventListener('DOMContentLoaded', loadLatestRecipe);
    </script>

    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }
        
        .latest-recipe {
            padding: var(--spacing-lg) 0;
        }
        
        .recipe-preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .recipe-preview-image img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .recipe-preview-content {
            padding: var(--spacing-lg);
        }
        
        .recipe-preview-content h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-md);
        }
        
        .recipe-story-preview {
            color: var(--medium-gray);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }

        .recipe-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        
        .loading, .no-recipes, .error {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--medium-gray);
        }
        
        @media (max-width: 768px) {
            .recipe-preview {
                grid-template-columns: 1fr;
            }
            
            .recipe-preview-image img {
                height: 200px;
            }
        }
    </style>
</body>
</html>
