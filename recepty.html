<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepty - BoomerChef</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZT7YEQJE43"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZT7YEQJE43');
    </script>
</head>
<body>
    <header>
        <nav class="nav-container">
            <div class="logo">
                <h1><a href="index.html">BoomerChef</a></h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Domů</a></li>
                <li><a href="recepty.html" class="nav-link active">Recepty</a></li>
                <li><a href="o-projektu.html" class="nav-link">O projektu</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="recipes-section">
            <div class="recipes-grid" id="recipes-grid">
                <!-- Recepty se načtou dynamicky ze Supabase -->
                <div class="text-center">
                    <p>Načítám recepty...</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 - 2026 BoomerChef - Recepty s příběhem</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // Načtení všech receptů
        async function loadAllRecipes() {
            const recipesGrid = document.getElementById('recipes-grid');
            try {
                const recipes = await RecipeService.getAllRecipes();

                if (!recipes || recipes.length === 0) {
                    recipesGrid.innerHTML = `
                        <div class="text-center">
                            <p>Zatím zde nejsou žádné recepty.</p>
                        </div>
                    `;
                    return;
                }

                // Karta je skutečný odkaz – funguje klávesnice i otevření v novém panelu
                recipesGrid.innerHTML = recipes.map(recipe => {
                    const imageUrl = recipe.image_url ? ImageService.getImageUrl(recipe.image_url) : 'images/placeholder.svg';

                    return `
                        <a class="recipe-card" href="recept.html?slug=${encodeURIComponent(recipe.slug)}">
                            <img src="${imageUrl}" alt="${Utils.escapeHtml(recipe.image_alt || recipe.title)}" loading="lazy">
                            <div class="recipe-card-content">
                                <h3>${Utils.escapeHtml(recipe.title)}</h3>
                                <p>${Utils.storyPreview(recipe.story, 150)}</p>
                                <div class="recipe-meta">
                                    <small>${Utils.formatDate(recipe.created_at)}</small>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (error) {
                console.error('Chyba při načítání receptů:', error);
                recipesGrid.innerHTML = `
                    <div class="text-center">
                        <p>Recepty se nepodařilo načíst. Zkuste to prosím znovu.</p>
                    </div>
                `;
            }
        }

        // Spustit při načtení stránky
        document.addEventListener('DOMContentLoaded', loadAllRecipes);
    </script>
</body>
</html>
